name: Svelte and TypeScript check

on:
  pull_request:
    branches: [sveltekit]
  push:
    branches: [sveltekit]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      MONGO_ID: check
      MONGO_PASS: check
      MASTER_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:generation && npm run test:files
